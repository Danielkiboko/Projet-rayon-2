name: ⏰ Rapports Quotidiens Automatiques (07h00)

on:
  schedule:
    # 06:00 UTC = 07:00 Heure de Kinshasa (UTC+1)
    - cron: '0 6 * * *'
  # Permet également de déclencher les rapports manuellement d'un clic depuis l'onglet Actions de GitHub
  workflow_dispatch:

jobs:
  execute-cron:
    name: 📊 Exécution du Rapport Matinal & Vérifications
    runs-on: ubuntu-latest

    steps:
      - name: 📬 Déclenchement du Rapport Journalier Fournisseurs & Admin (07h00)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Envoi de la requête du rapport journalier à https://projet-rayon-2.vercel.app/api/cron/daily-reports..."
          RESPONSE=$(curl -f -s -S -w "\n%{http_code}" --max-time 180 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://projet-rayon-2.vercel.app/api/cron/daily-reports")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "Code HTTP: $HTTP_CODE"
          echo "Réponse: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Échec du rapport — code $HTTP_CODE"
            exit 1
          fi
          echo "✅ Rapport journalier exécuté avec succès !"

      - name: 📑 Contrôle des Baux et Loyers Échus
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Vérification des baux et notifications locataires..."
          curl -s -S --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://projet-rayon-2.vercel.app/api/cron/check-leases" || echo "Vérification baux terminée avec avertissement."
