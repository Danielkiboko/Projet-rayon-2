runConfig:
  minInstances: 0

env:
  - variable: NEXT_PUBLIC_APP_URL
    value: https://rayons.net
    availability:
      - BUILD
      - RUNTIME

  # CRON_SECRET: à définir via Firebase Console → App Hosting → Secrets / Variables d'environnement
  - variable: CRON_SECRET
    value: "REMPLACEZ_PAR_VOTRE_SECRET"
    availability:
      - RUNTIME
